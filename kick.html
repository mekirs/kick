<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Overlay Mekirs</title>
<style>
  body {
    margin: 0;
    padding: 0;
    width: 1280px;
    height: 720px;
    overflow: hidden;
    background: transparent;
    position: relative;
    font-family: Arial, sans-serif;
  }

  iframe {
    border: none;
    position: absolute;
  }

  /* Chat */
  #chat {
    bottom: 10px;
    left: 10px;
    width: 280px;
    height: 200px;
  }

  /* ALERTS */
  #alerts-container {
    position: absolute;
    left: -120px;
    bottom: 120px;
    width: 750px;
    height: 500px;
    transform: scale(0.78);
    transform-origin: bottom left;
  }

  #alerts-container iframe {
    width: 750px;
    height: 500px;
  }

  /* NUEVA META (subs) */
  #goal {
    top: 10px;
    left: 42%;
    transform: translateX(-50%);
    width: 500px;
    height: 90px;
  }

  /* Tops */
  #tops {
    position: absolute;
    top: 0;
    right: 360px;
    width: 420px;
  }

  .top-box {
    position: relative;
    width: 700px;
    height: 100px;
    transform: scale(0.6);
    transform-origin: top right;
  }

  .top-box iframe {
    width: 700px;
    height: 100px;
  }

  /* POSICIONES */
  #top-kick {
    margin-top: 20px;
  }

  #top-subs {
    margin-top: -60px;
  }

  #top-propina {
    margin-top: -60px;
  }

  #ultimo-sub {
    margin-top: -60px;
  }

</style>
</head>
<body>

<!-- Chat -->
<iframe id="chat" src="https://botrix.live/widgets/chat/?bid=hL4jXwuISOTVQTdQVTPC9A&theme=cake&messageSound=0&messageDirection=up&platformIcon=false&bots=false&emojis=true&hideCommands=false&hideMessages=true&hideMessagesSeconds=15&widgetSize=21&streamTogether=true&cheer=true&pointsReward=false&animation=popIn&showTimestamp=false&shadowThickness=1&twitch=false&youtube=false&kick=true&trovo=false"></iframe>

<!-- Alerts -->
<div id="alerts-container">
  <iframe src="https://botrix.live/alerts?bid=hL4jXwuISOTVQTdQVTPC9A"></iframe>
</div>

<!-- META SUBS -->
<iframe id="goal" src="https://botrix.live/widgets/goals/kicksubs/?bid=hL4jXwuISOTVQTdQVTPC9A&platform=kick&goalId=kicksubs-kick&mode=windowed&theme=cleanradius&targetValue=10&rank=1&fontFamily=Arial&fontSize=32&fillColor=%2355cc00&textColor=%23ffffff&message=SUSCRIPTORES%20DEL%20MES&initialValue=1&align=center&windowResetMode=calendar&calendarPreset=month&resetHourOffset=0"></iframe>

<!-- Tops -->
<div id="tops">

  <div class="top-box" id="top-kick">
    <iframe src="https://botrix.live/widgets/labels?bid=hL4jXwuISOTVQTdQVTPC9A&text=%F0%9F%92%9ATOP+KICKS%3A+%7Bname%7D+-+%7Bamount%7D&font=Arial&type=topTodayKicks&platform=kick&align=left&fontSize=40&fontWeight=700&color=%23a6ff00&shadow=0px+0px+10px+%23000000"></iframe>
  </div>

  <div class="top-box" id="top-subs">
    <iframe src="https://botrix.live/widgets/labels?bid=hL4jXwuISOTVQTdQVTPC9A&text=%F0%9F%8E%81TOP+DE+SUBS%3A+%7Bname%7D+-+%7Bamount%7D&font=Arial&type=topTodaySubGifter&platform=kick&align=left&fontSize=40&fontWeight=700&color=%23ff1a1a&shadow=0px+0px+10px+%23000000"></iframe>
  </div>

  <div class="top-box" id="top-propina">
    <iframe src="https://botrix.live/widgets/labels?bid=hL4jXwuISOTVQTdQVTPC9A&text=%E2%AD%90TOP+PROPINA%3A+%7Bname%7D+-+%7Bamount%7D+%7Bcurrency%7D&font=Arial&type=topPaypal&platform=kick&align=left&fontSize=40&fontWeight=700&color=%23ff0066&shadow=0px+0px+10px+%23000000"></iframe>
  </div>

  <!-- NUEVO: último suscriptor -->
  <div class="top-box" id="ultimo-sub">
    <iframe src="https://botrix.live/widgets/labels?bid=hL4jXwuISOTVQTdQVTPC9A&text=%F0%9F%91%91Suscriptor%3A+%7Bvalue%7D&font=Arial&type=ultimoSub&platform=kick&align=left&fontSize=32&fontWeight=700&gradient=linear-gradient(%23fbff00%2C+%23ff7b00)&shadow=0px+0px+10px+%23000000"></iframe>
  </div>

</div>

</body>
</html>
