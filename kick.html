<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Overlay Mekirs</title>
<style>
  body {
    margin: 0;
    padding: 0;
    width: 1280px;
    height: 720px;
    overflow: hidden;
    background: transparent;
    position: relative;
    font-family: Arial, sans-serif;
  }

  iframe {
    border: none;
    position: absolute;
  }

  /* CHAT (recorte superior leve controlado) */
  #chat {
    position: absolute;
    left: 0;
    bottom: 10px;
    width: 240px;
    height: 360px;
    transform: translateY(-10px); /* sube un poco para mostrar más arriba */
  }

  /* ALERTS */
  #alerts-container {
    position: absolute;
    left: -120px;
    bottom: 120px;
    width: 750px;
    height: 500px;
    transform: scale(0.78);
    transform-origin: bottom left;
  }

  #alerts-container iframe {
    width: 750px;
    height: 500px;
  }

  /* META */
  #goal {
    top: 8px;
    left: 42%;
    transform: translateX(-50%);
    width: 500px;
    height: 90px;
  }

  /* TOPS (más a la izquierda) */
  #tops {
    position: absolute;
    top: 70px;
    left: 27%; /* más a la izquierda que antes */
    transform: translateX(-50%);
    width: 420px;
  }

  .top-box {
    position: relative;
    width: 700px;
    height: 100px;
    transform: scale(0.52);
    transform-origin: top center;
  }

  .top-box iframe {
    width: 700px;
    height: 100px;
  }

  #top-kick { margin-top: 0px; }
  #top-subs { margin-top: -70px; }
  #top-propina { margin-top: -70px; }
  #ultimo-sub { margin-top: -70px; }


</style>
</head>
<body>

<!-- CHAT -->
<iframe id="chat" src="https://botrix.live/widgets/chat/?bid=hL4jXwuISOTVQTdQVTPC9A&theme=cake&messageSound=0&messageDirection=up&platformIcon=true&bots=true&emojis=true&hideCommands=false&hideMessages=true&hideMessagesSeconds=163&widgetSize=32&streamTogether=true&cheer=true&pointsReward=true&animation=popIn&showTimestamp=false&shadowThickness=1&twitch=false&youtube=false&kick=true&trovo=false"></iframe>

<!-- ALERTS -->
<div id="alerts-container">
  <iframe src="https://botrix.live/alerts?bid=hL4jXwuISOTVQTdQVTPC9A"></iframe>
</div>

<!-- META -->
